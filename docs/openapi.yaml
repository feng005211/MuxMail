openapi: 3.1.0
info:
  title: MuxMail API
  version: 0.1.0
  description: |
    OpenAPI description for the current MuxMail Lite HTTP API.

    This spec covers the file-config, in-memory queue, JSONL log runtime that is
    currently implemented in the repository.
servers:
  - url: http://localhost:8080
security:
  - AppBearerAuth: []
tags:
  - name: Health
  - name: Admin
  - name: Send
  - name: Messages
  - name: Suppressions
  - name: ProviderEvents
  - name: Stats
paths:
  /healthz:
    get:
      tags: [Health]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /readyz:
    get:
      tags: [Health]
      summary: Readiness probe
      security: []
      responses:
        "200":
          description: Runtime is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Runtime is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotReadyResponse"
  /version:
    get:
      tags: [Health]
      summary: Build version
      security: []
      responses:
        "200":
          description: Current MuxMail version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
  /v1/mail/send:
    post:
      tags: [Send]
      summary: Enqueue one transactional email
      security:
        - AppBearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: "^[!-~]+$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendRequest"
      responses:
        "202":
          description: Message accepted and queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendResponse"
        "4XX":
          description: Validation, auth, rate-limit, or queue admission error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "5XX":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/mail/messages:
    get:
      tags: [Messages]
      summary: List latest message snapshots for the authenticated App
      security:
        - AppBearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/MessageStatus"
        - in: query
          name: scene
          schema:
            type: string
            minLength: 1
            maxLength: 64
            pattern: "^[a-z0-9](?:[a-z0-9_-]{0,62}[a-z0-9])?$"
      responses:
        "200":
          description: Latest message snapshots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageListResponse"
        "401":
          description: Missing or invalid App API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid query filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/mail/messages/failed:
    get:
      tags: [Messages]
      summary: List recent failed messages for the authenticated App
      security:
        - AppBearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - in: query
          name: scene
          schema:
            type: string
            minLength: 1
            maxLength: 64
            pattern: "^[a-z0-9](?:[a-z0-9_-]{0,62}[a-z0-9])?$"
      responses:
        "200":
          description: Failed message snapshots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageListResponse"
        "401":
          description: Missing or invalid App API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid query filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/mail/messages/{message_id}:
    get:
      tags: [Messages]
      summary: Query the latest message status snapshot
      security:
        - AppBearerAuth: []
      parameters:
        - in: path
          name: message_id
          required: true
          schema:
            type: string
            pattern: ^msg_[A-Za-z0-9_-]{1,124}$
            maxLength: 128
      responses:
        "200":
          description: Latest message snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageStatusResponse"
        "401":
          description: Missing or invalid App API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Message not found in the authenticated App
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/mail/messages/{message_id}/events:
    get:
      tags: [Messages]
      summary: Query the provider event timeline for one message
      security:
        - AppBearerAuth: []
      parameters:
        - in: path
          name: message_id
          required: true
          schema:
            type: string
            pattern: ^msg_[A-Za-z0-9_-]{1,124}$
            maxLength: 128
      responses:
        "200":
          description: Provider event timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageEventsResponse"
        "401":
          description: Missing or invalid App API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Message not found in the authenticated App
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/mail/messages/{message_id}/attempts:
    get:
      tags: [Messages]
      summary: Query the provider attempt timeline for one message
      security:
        - AppBearerAuth: []
      parameters:
        - in: path
          name: message_id
          required: true
          schema:
            type: string
            pattern: ^msg_[A-Za-z0-9_-]{1,124}$
            maxLength: 128
      responses:
        "200":
          description: Provider attempt timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageAttemptsResponse"
        "401":
          description: Missing or invalid App API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Message not found in the authenticated App
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/suppressions:
    get:
      tags: [Suppressions]
      summary: List suppressions for the authenticated App
      security:
        - AppBearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - in: query
          name: reason
          schema:
            $ref: "#/components/schemas/SuppressionReason"
        - in: query
          name: email
          schema:
            type: string
            format: email
            maxLength: 254
            pattern: "^[A-Za-z0-9!#$%&'*+/=?^_`{|}~-]+(?:\\.[A-Za-z0-9!#$%&'*+/=?^_`{|}~-]+)*@[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?(?:\\.[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?)*$"
            description: Must be a single ASCII addr-spec value without display name syntax, comments, whitespace, or non-ASCII characters.
      responses:
        "200":
          description: Suppression list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuppressionListResponse"
        "401":
          description: Missing or invalid App API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid query filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/provider-events:
    get:
      tags: [ProviderEvents]
      summary: List recent provider events for the authenticated App
      security:
        - AppBearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - in: query
          name: provider
          schema:
            $ref: "#/components/schemas/Provider"
        - in: query
          name: event_type
          schema:
            $ref: "#/components/schemas/ProviderEventType"
      responses:
        "200":
          description: Recent provider events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderEventListResponse"
        "401":
          description: Missing or invalid App API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid query filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [ProviderEvents]
      summary: Accept one normalized provider event
      description: Requires webhooks.enabled and webhooks.shared_secret_ref, complete provider identity metadata, and only accepts events matching a recorded sent attempt for the same App and message. If the recorded sent attempt has an empty provider_message_id because an accepted provider response omitted it, the event must still provide provider_message_id and match the recorded provider account and channel. Bounced and complained events must include a valid single addr-spec recipient_email so MuxMail can update suppressions. Lite mode logs a redacted source summary instead of the raw event_payload. Duplicate identities do not append another event record, but may replay idempotent suppression and monotonic status repair.
      security:
        - WebhookBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderEventRequest"
      responses:
        "202":
          description: Event accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderEventResponse"
        "4XX":
          description: Auth or validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "5XX":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/provider-events/resend:
    post:
      tags: [ProviderEvents]
      summary: Accept one native Resend webhook event
      description: Requires webhooks.enabled and webhooks.resend_secret_ref. Verifies Svix headers, requires MuxMail tags for app, message_id, provider_account, and provider_channel, then accepts only events matching a recorded sent attempt. If the sent attempt has an empty provider_message_id because the accepted Resend response omitted it, the webhook email_id is still required and the recorded provider account and channel must match. Bounce and complaint events must include a valid single addr-spec recipient email for suppression updates.
      security: []
      parameters:
        - in: header
          name: svix-id
          required: true
          schema:
            type: string
        - in: header
          name: svix-timestamp
          required: true
          schema:
            type: string
        - in: header
          name: svix-signature
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "202":
          description: Event accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderEventResponse"
        "4XX":
          description: Auth or validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "5XX":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/provider-events/brevo:
    post:
      tags: [ProviderEvents]
      summary: Accept one native Brevo webhook event
      description: Requires webhooks.enabled and webhooks.brevo_token_ref. Verifies the configured Bearer token, requires MuxMail metadata tags for app, message_id, provider_account, and provider_channel, requires ts_event for UTC occurred_at normalization, then accepts only events matching a recorded sent attempt. If the sent attempt has an empty provider_message_id because the accepted Brevo response omitted it, the webhook message-id is still required and the recorded provider account and channel must match. Bounce and complaint events must include a valid single addr-spec recipient email for suppression updates.
      security:
        - WebhookBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "202":
          description: Event accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderEventResponse"
        "4XX":
          description: Auth or validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "5XX":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/stats/summary:
    get:
      tags: [Stats]
      summary: Query an App-scoped stats summary
      security:
        - AppBearerAuth: []
      parameters:
        - in: query
          name: window
          schema:
            type: string
            enum: [1h, 24h, 7d]
            default: 24h
      responses:
        "200":
          description: Stats summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsSummaryResponse"
        "401":
          description: Missing or invalid App API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid query filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/admin/config-summary:
    get:
      tags: [Admin]
      summary: Query App-scoped admin configuration metadata
      description: Returns Lite admin configuration metadata without API keys, provider secrets, webhook secrets, SMTP passwords, or runtime filesystem paths. All /v1/ responses are served with Cache-Control no-store.
      security:
        - AppBearerAuth: []
      responses:
        "200":
          description: Safe App-scoped configuration summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminConfigSummaryResponse"
        "401":
          description: Missing or invalid App API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    AppBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: App API key used for send and read-only App-scoped queries.
    WebhookBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: webhook secret or token
      description: Bearer authentication for MuxMail normalized provider events using webhooks.shared_secret_ref, and for Brevo webhook events using webhooks.brevo_token_ref.
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    NotReadyResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [not_ready]
    VersionResponse:
      type: object
      required: [version]
      properties:
        version:
          type: string
          example: 0.1.0
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
            request_id:
              type: string
    SendRequest:
      type: object
      required: [scene, to]
      properties:
        scene:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[a-z0-9](?:[a-z0-9_-]{0,62}[a-z0-9])?$"
        to:
          type: string
          format: email
          maxLength: 254
          pattern: "^[A-Za-z0-9!#$%&'*+/=?^_`{|}~-]+(?:\\.[A-Za-z0-9!#$%&'*+/=?^_`{|}~-]+)*@[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?(?:\\.[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?)*$"
          description: Must be a single ASCII addr-spec value without display name syntax, comments, whitespace, or non-ASCII characters.
        locale:
          type: string
          pattern: "^[a-z]{2,3}-[A-Z]{2}$"
        vars:
          type: object
          maxProperties: 32
          propertyNames:
            minLength: 1
            maxLength: 64
            pattern: "^[^\\s.]+$"
          additionalProperties:
            oneOf:
              - type: string
                maxLength: 1024
              - type: number
              - type: boolean
        context:
          type: object
          maxProperties: 16
          propertyNames:
            minLength: 1
            maxLength: 64
          properties:
            user_ip:
              oneOf:
                - type: string
                  format: ipv4
                - type: string
                  format: ipv6
            user_id:
              type: string
              maxLength: 256
            request_id:
              type: string
              maxLength: 128
              pattern: "^[!-~]+$"
          additionalProperties:
            oneOf:
              - type: string
                maxLength: 256
              - type: number
              - type: boolean
    SendResponse:
      type: object
      required: [request_id, message_id, status]
      properties:
        request_id:
          type: string
        message_id:
          type: string
        status:
          $ref: "#/components/schemas/MessageStatus"
    MessageStatusResponse:
      type: object
      required: [message_id, request_id, app, scene, status, locale, to_domain, to_hash, updated_at]
      properties:
        message_id:
          type: string
        request_id:
          type: string
        business_request_id:
          type: string
        app:
          type: string
        scene:
          type: string
        status:
          $ref: "#/components/schemas/MessageStatus"
        locale:
          type: string
        to_domain:
          type: string
        to_hash:
          type: string
        error_code:
          $ref: "#/components/schemas/ErrorCode"
        error_message:
          type: string
        updated_at:
          type: string
          format: date-time
    MessageListResponse:
      type: object
      required: [app, limit, messages]
      properties:
        app:
          type: string
        limit:
          type: integer
        messages:
          type: array
          items:
            $ref: "#/components/schemas/MessageStatusResponse"
    MessageEventsResponse:
      type: object
      required: [message_id, app, events]
      properties:
        message_id:
          type: string
        app:
          type: string
        events:
          type: array
          items:
            $ref: "#/components/schemas/MessageEventEntry"
    MessageEventEntry:
      type: object
      required: [logged_at, provider, provider_account, provider_channel, provider_message_id, event_type, occurred_at]
      properties:
        logged_at:
          type: string
          format: date-time
        provider:
          $ref: "#/components/schemas/Provider"
        provider_account:
          type: string
        provider_channel:
          type: string
        provider_message_id:
          type: string
        event_type:
          $ref: "#/components/schemas/ProviderEventType"
        occurred_at:
          type: string
          format: date-time
    MessageAttemptsResponse:
      type: object
      required: [message_id, app, attempts]
      properties:
        message_id:
          type: string
        app:
          type: string
        attempts:
          type: array
          items:
            $ref: "#/components/schemas/MessageAttemptEntry"
    MessageAttemptEntry:
      type: object
      required: [logged_at, attempt_no, provider, provider_account, provider_channel, transport, status, duration_ms]
      properties:
        logged_at:
          type: string
          format: date-time
        attempt_no:
          type: integer
        provider:
          type: string
          enum: ["", mock, resend, brevo]
          description: Empty only when a runtime channel resolution failure occurs before provider metadata is available.
        provider_account:
          type: string
          description: Empty only when a runtime channel resolution failure occurs before account metadata is available.
        provider_channel:
          type: string
        transport:
          type: string
          enum: ["", api, smtp]
          description: Empty only when a runtime channel resolution failure occurs before transport metadata is available.
        status:
          $ref: "#/components/schemas/AttemptStatus"
        failure_class:
          $ref: "#/components/schemas/FailureClass"
        error_code:
          $ref: "#/components/schemas/ErrorCode"
        error_message:
          type: string
        provider_message_id:
          type: string
        duration_ms:
          type: integer
    SuppressionListResponse:
      type: object
      required: [app, limit, suppressions]
      properties:
        app:
          type: string
        limit:
          type: integer
        suppressions:
          type: array
          items:
            $ref: "#/components/schemas/SuppressionEntry"
    SuppressionEntry:
      type: object
      required: [email, normalized_email, reason]
      properties:
        email:
          type: string
        normalized_email:
          type: string
        reason:
          $ref: "#/components/schemas/SuppressionReason"
    ProviderEventListResponse:
      type: object
      required: [app, limit, events]
      properties:
        app:
          type: string
        limit:
          type: integer
        events:
          type: array
          items:
            $ref: "#/components/schemas/ProviderEventListEntry"
    ProviderEventListEntry:
      type: object
      required: [message_id, logged_at, provider, provider_account, provider_channel, provider_message_id, event_type, occurred_at]
      properties:
        message_id:
          type: string
        logged_at:
          type: string
          format: date-time
        provider:
          $ref: "#/components/schemas/Provider"
        provider_account:
          type: string
        provider_channel:
          type: string
        provider_message_id:
          type: string
        event_type:
          $ref: "#/components/schemas/ProviderEventType"
        occurred_at:
          type: string
          format: date-time
    ProviderEventRequest:
      type: object
      required: [app, message_id, provider, provider_account, provider_channel, provider_message_id, event_type, occurred_at]
      properties:
        app:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[a-z0-9](?:[a-z0-9_-]{0,62}[a-z0-9])?$"
        message_id:
          type: string
          pattern: ^msg_[A-Za-z0-9_-]{1,124}$
          maxLength: 128
        provider:
          $ref: "#/components/schemas/Provider"
        provider_account:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[a-z0-9](?:[a-z0-9_-]{0,62}[a-z0-9])?$"
        provider_channel:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[a-z0-9](?:[a-z0-9_-]{0,62}[a-z0-9])?$"
        provider_message_id:
          type: string
        recipient_email:
          type: string
          format: email
          maxLength: 254
          pattern: "^[A-Za-z0-9!#$%&'*+/=?^_`{|}~-]+(?:\\.[A-Za-z0-9!#$%&'*+/=?^_`{|}~-]+)*@[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?(?:\\.[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?)*$"
          description: Required for bounced and complained events; must be a single addr-spec value without display name syntax.
        event_type:
          $ref: "#/components/schemas/ProviderEventType"
        event_payload:
          type: string
          description: Accepted for compatibility with normalized webhook senders; Lite mode logs a redacted source summary instead of this raw payload.
        occurred_at:
          type: string
          format: date-time
    ProviderEventResponse:
      type: object
      required: [message_id, app, status]
      properties:
        message_id:
          type: string
        app:
          type: string
        status:
          $ref: "#/components/schemas/MessageStatus"
    StatsSummaryResponse:
      type: object
      required: [app, window, since, until, metrics, provider_durations]
      properties:
        app:
          type: string
        window:
          type: string
        since:
          type: string
          format: date-time
        until:
          type: string
          format: date-time
        metrics:
          type: object
          additionalProperties:
            type: number
        provider_durations:
          type: array
          items:
            type: object
            required: [provider_channel, transport, count, average_ms, total_ms]
            properties:
              provider_channel:
                type: string
              transport:
                $ref: "#/components/schemas/Transport"
              count:
